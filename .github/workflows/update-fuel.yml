name: Update official fuel prices
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-fuel.py'
      - '.github/workflows/update-fuel.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: update-official-fuel
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read European Commission and ECB data
        run: python scripts/update-fuel.py
      - name: Save refreshed data and request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- fuel-prices.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuel-prices.json
          git commit -m 'Refresh official fuel price snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"